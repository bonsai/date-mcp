flow:
  - station
  - cafe
  - walk_or_art
  - dinner
  - night_option

ax:
  principle: "最初からデートのゴールを固定せず、会話・時間・疲労・興味の変化に応じて次の選択肢を残す"
  next_action_rule: "点を推薦するのではなく、その時点で自然に接続できる次の点を提示する"
  reverse_view:
    - "夜まで残ることが本当に望ましいとは限らない"
    - "駅近だけで完結させるより、途中の余白が体験を変える可能性がある"
    - "候補の営業状況や閉店・改修は時点データとして検証する必要がある"

viability:
  event: unknown
  food: available
  evening: available
  transport: available
  private_stay: "要検証"
  city_continuation: provisional_high

research_note: "仮データ。営業時間・営業状況・イベント・宿泊/プライベート滞在候補は実利用前に再検証する。"
